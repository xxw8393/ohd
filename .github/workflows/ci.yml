name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Run tests & installDist
        run: gradle jvmTest installDist

      - name: Run selftest (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x dist/ohd
          ./dist/ohd selftest

      - name: Run selftest (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: dist\ohd.bat selftest
